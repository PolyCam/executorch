name: cd
on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version (e.g., 0.1.0)
        required: true
        type: string
        default: 0.0.0

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on:
      - self-hosted
      - macOS
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: install uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
          python-version: "3.12"

      - name: install torch + executorch python deps
        run: |
          uv venv .venv --python 3.12
          source .venv/bin/activate
          # install_requirements.sh reads torch_pin.py for the pinned
          # version + index URL (CPU wheels on macOS, no CUDA).
          bash install_requirements.sh
          echo "PYTHON_EXECUTABLE=$PWD/.venv/bin/python" >> "$GITHUB_ENV"

      - name: build android aar
        run: bash scripts/build-polycam-aar.sh android

      - name: create archive
        run: tar -czf dist/executorch-android.tgz -C dist/android executorch.aar

      - name: upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: executorch-android.tgz
          path: dist/executorch-android.tgz
          retention-days: 1

  release:
    needs: [build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: compute release info
        id: info
        run: |
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          if [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: create github release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ steps.info.outputs.sha }}
          name: v${{ inputs.version }}
          body: '@poly/executorch v${{ inputs.version }}'
          prerelease: ${{ steps.info.outputs.prerelease == 'true' }}
          files: |
            artifacts/executorch-android.tgz

  publish-npm:
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: publish
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service_key.json
        run: |
          echo "${{ secrets.ARTIFACT_REGISTRY_KEY }}" | base64 -d > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx google-artifactregistry-auth
          npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version
          npm publish --registry https://us-central1-npm.pkg.dev/polycam-shared-infra-prod/npm/
